name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - name: Deploy with secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ABLESCI_ACCOUNTS: ${{ secrets.ABLESCI_ACCOUNTS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          SCKEY: ${{ secrets.SCKEY }}
          XZKEY: ${{ secrets.XZKEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ABLESCI_ACCOUNTS" && test -n "$ADMIN_TOKEN"
          node -e "if(process.env.ADMIN_TOKEN.length < 32) process.exit(1)"
          node - <<'JS'
          const fs = require('fs');
          const names = ['ABLESCI_ACCOUNTS','ADMIN_TOKEN','PUSH_PLUS_TOKEN','SCKEY','XZKEY'];
          const secrets = Object.fromEntries(names.map(k => [k, process.env[k] || '']));
          fs.writeFileSync('/tmp/ablesign-secrets.json', JSON.stringify(secrets), { mode: 0o600 });
          JS
          npx wrangler deploy --secrets-file /tmp/ablesign-secrets.json
          rm -f /tmp/ablesign-secrets.json
